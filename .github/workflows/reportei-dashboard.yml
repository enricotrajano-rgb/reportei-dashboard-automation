name: Atualizar Dashboard Reportei

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Periodo automatico"
        required: true
        default: "current_month_until_yesterday"
        type: choice
        options:
          - current_month_until_yesterday
          - previous_month
          - last_7_days
          - last_30_days
      start:
        description: "Data inicial opcional (DD/MM/YYYY ou YYYY-MM-DD)"
        required: false
        default: ""
      end:
        description: "Data final opcional (DD/MM/YYYY ou YYYY-MM-DD)"
        required: false
        default: ""

  schedule:
    # Tentativa principal: 09:07 UTC = 06:07 em Sao Paulo.
    - cron: "7 9 * * *"
    # Fallback: 11:07 UTC = 08:07 em Sao Paulo.
    - cron: "7 11 * * *"

concurrency:
  group: reportei-dashboard-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      REPORTEI_TOKEN: ${{ secrets.REPORTEI_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_WORKSHEET_NAME: Base
      REPORTEI_TOP_POSTS_WORKSHEET_NAME: Top Posts
      REPORTEI_DASHBOARD_MODE: update_values
      REPORTEI_DASHBOARD_NETWORKS: facebook,instagram_business,linkedin,tiktok,youtube
      REPORTEI_DASHBOARD_EXCLUDE_PROJECTS: Agro Agenda
      REPORTEI_TOP_POSTS_NETWORKS: facebook,instagram_business
      REPORTEI_TOP_POSTS_EXCLUDE_PROJECTS: Agro Agenda
      RUN_TOP_POSTS: "false"
      PYTHONIOENCODING: utf-8
      TZ: America/Sao_Paulo

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Evitar execucao agendada duplicada
        id: schedule_guard
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today="$(TZ=America/Sao_Paulo date +%F)"
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/reportei-dashboard.yml/runs?event=schedule&per_page=20"

          if ! runs_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api_url}")"; then
            echo "::warning::Nao foi possivel consultar runs anteriores; esta execucao continuara."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r created_at; do
            [ -n "$created_at" ] || continue
            run_date="$(TZ=America/Sao_Paulo date -d "$created_at" +%F)"
            if [ "$run_date" = "$today" ]; then
              echo "Execucao agendada bem-sucedida ja encontrada para $today ($created_at)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .created_at' <<< "$runs_json")

          echo "Nenhuma execucao agendada bem-sucedida encontrada para $today."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restaurar cache Reportei
        uses: actions/cache@v4
        with:
          path: .reportei_cache
          key: reportei-cache-${{ github.run_id }}
          restore-keys: |
            reportei-cache-

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar secrets obrigatorios
        shell: bash
        run: |
          test -n "$REPORTEI_TOKEN" || (echo "REPORTEI_TOKEN ausente" && exit 1)
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || (echo "GOOGLE_SERVICE_ACCOUNT_JSON ausente" && exit 1)
          test -n "$GOOGLE_SPREADSHEET_ID" || (echo "GOOGLE_SPREADSHEET_ID ausente" && exit 1)

      - name: Atualizar dashboard
        if: steps.schedule_guard.outputs.should_run != 'false'
        shell: bash
        run: |
          failed_networks=()
          success_count=0
          network_list="${REPORTEI_DASHBOARD_NETWORKS//,/ }"

          for network in $network_list; do
            echo "::group::Atualizar rede: $network"
            if [ -n "${{ inputs.start }}" ] || [ -n "${{ inputs.end }}" ]; then
              python "Exportação_Oficial.py" \
                --start "${{ inputs.start }}" \
                --end "${{ inputs.end }}" \
                --networks "$network"
            else
              python "Exportação_Oficial.py" \
                --period "${{ inputs.period || 'current_month_until_yesterday' }}" \
                --networks "$network"
            fi
            status=$?
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              success_count=$((success_count + 1))
            else
              failed_networks+=("$network")
              echo "::warning::Rede $network falhou com exit code $status. As demais redes continuam."
            fi
          done

          if [ "${#failed_networks[@]}" -gt 0 ]; then
            echo "Redes com falha: ${failed_networks[*]}"
          fi

          if [ "$success_count" -eq 0 ]; then
            echo "Nenhuma rede foi atualizada com sucesso."
            exit 1
          fi

      - name: Atualizar top posts
        if: env.RUN_TOP_POSTS == 'true' && steps.schedule_guard.outputs.should_run != 'false'
        shell: bash
        run: |
          if [ -n "${{ inputs.start }}" ] || [ -n "${{ inputs.end }}" ]; then
            python Top_Posts.py \
              --start "${{ inputs.start }}" \
              --end "${{ inputs.end }}"
          else
            python Top_Posts.py \
              --period "${{ inputs.period || 'current_month_until_yesterday' }}"
          fi

      - name: Publicar historicos da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportei-dashboard-history
          path: |
            reportei_dashboard_run_history.csv
            reportei_dashboard_block_history.csv
          if-no-files-found: ignore

